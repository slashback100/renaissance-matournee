name: Build IPA with new icon
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Extract base IPA
        run: |
          rm -rf /tmp/ipa && mkdir /tmp/ipa
          cd /tmp/ipa && unzip -q $GITHUB_WORKSPACE/base.ipa
      - name: Replace web app
        run: |
          rm -rf /tmp/ipa/Payload/App.app/public
          cp -r $GITHUB_WORKSPACE/www /tmp/ipa/Payload/App.app/public
      - name: Update Info.plist
        run: |
          cd /tmp/ipa/Payload/App.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Ma tournée" Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier be.vbrenaissance.matournee" Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" Info.plist
      - name: Compile Assets.car
        run: |
          rm -rf /tmp/compiled && mkdir /tmp/compiled
          actool --compile /tmp/compiled \
            --platform iphoneos \
            --minimum-deployment-target 14.0 \
            --target-device iphone --target-device ipad \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/compiled/partial.plist \
            $GITHUB_WORKSPACE/ios/Assets.xcassets
          echo "=== compiled ==="
          find /tmp/compiled -type f
          echo "=== partial plist ==="
          cat /tmp/compiled/partial.plist
      - name: Replace loose icons + Assets.car
        run: |
          APP=/tmp/ipa/Payload/App.app
          ICONS=$GITHUB_WORKSPACE/ios/Assets.xcassets/AppIcon.appiconset
          cp /tmp/compiled/Assets.car "$APP/Assets.car"
          cp "$ICONS/icon-120a.png" "$APP/AppIcon60x60@2x.png"
          cp "$ICONS/icon-152.png" "$APP/AppIcon76x76@2x~ipad.png"
          echo "=== app icons ==="
          ls -la "$APP"/Assets.car "$APP"/AppIcon*.png
      - name: Rebuild IPA
        run: cd /tmp/ipa && zip -r $GITHUB_WORKSPACE/MaTournee-Renaissance.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaTournee-Renaissance-ipa
          path: MaTournee-Renaissance.ipa
